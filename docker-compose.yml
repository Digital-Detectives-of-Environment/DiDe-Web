        # Veri hazır olana kadar bekler; hazır olunca servise girer.
        # Harita dosyasını değiştirip yeniden hazırlarsan (.source-stamp değişir)
        # bu döngü router'ı KENDİLİĞİNDEN yeniden başlatır — yoksa eski veriyle
        # çalışmaya devam eder ve hiçbir rota bulunamaz.
        while true; do
          while [ ! -f /data/bike/.source-stamp ]; do
            echo "[osrm-bike] waiting for map data (check: docker compose logs osrm-prepare)"
            sleep 10
          done
          STAMP="$$(cat /data/bike/.source-stamp)"
          echo "[osrm-bike] data ready (stamp $$STAMP), starting router."
          osrm-routed --algorithm mld /data/bike/map.osrm &
          PID=$$!
          while kill -0 $$PID 2>/dev/null; do
            sleep 10
            NEW="$$(cat /data/bike/.source-stamp 2>/dev/null || echo '')"
            if [ "$$NEW" != "$$STAMP" ]; then
              echo "[osrm-bike] map data changed → restarting router with the new data."
              kill $$PID 2>/dev/null || true
              wait $$PID 2>/dev/null || true
              break
            fi
          done
          sleep 2
        done
    ports:
      - "127.0.0.1:5002:5000"

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: dide-osrm-foot
    restart: unless-stopped
    volumes:
      - ./osrm-data:/data
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Veri hazır olana kadar bekler; hazır olunca servise girer.
        # Harita dosyasını değiştirip yeniden hazırlarsan (.source-stamp değişir)
        # bu döngü router'ı KENDİLİĞİNDEN yeniden başlatır — yoksa eski veriyle
        # çalışmaya devam eder ve hiçbir rota bulunamaz.
        while true; do
          while [ ! -f /data/foot/.source-stamp ]; do
            echo "[osrm-foot] waiting for map data (check: docker compose logs osrm-prepare)"
            sleep 10
          done
          STAMP="$$(cat /data/foot/.source-stamp)"
          echo "[osrm-foot] data ready (stamp $$STAMP), starting router."
          osrm-routed --algorithm mld /data/foot/map.osrm &

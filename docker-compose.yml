services:
  # 1) Rotalama verisini SENİN dosyandan hazırlar (indirme yok)
  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: dide-osrm-prepare
    restart: "no"
    volumes:
      # Kaynak: case_study/<CASE_STUDY>/existing_data  (salt okunur)
      - ./case_study/${CASE_STUDY:?CASE_STUDY is not set in .env. Routing needs case_study/<CASE_STUDY>/existing_data/map.osm}/existing_data:/input:ro
      # Hedef: işlenmiş rotalama verisi
      - ./osrm-data:/data
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        SRC=""
        if   [ -s /input/map.osm.pbf ]; then SRC=/input/map.osm.pbf
        elif [ -s /input/map.osm ];     then SRC=/input/map.osm
        fi
        if [ -z "$$SRC" ]; then
          echo "[osrm-prepare] ERROR: no map file found."
          echo "[osrm-prepare] Put your OpenStreetMap export at:"
          echo "[osrm-prepare]   case_study/<CASE_STUDY>/existing_data/map.osm   (or map.osm.pbf)"
          exit 1
        fi
        STAMP="$$(stat -c '%s-%Y' "$$SRC")"
        echo "[osrm-prepare] source: $$SRC  (stamp $$STAMP)"
        prepare () {
          profile="$$1"; dir="$$2"
          if [ -f "/data/$$dir/map.osrm.mldgr" ] && [ "$$(cat /data/$$dir/.source-stamp 2>/dev/null)" = "$$STAMP" ]; then
            echo "[osrm-prepare] $$dir already prepared for this file, skipping."
            return 0
          fi
          echo "[osrm-prepare] preparing $$dir ..."
          rm -rf "/data/$$dir"
          mkdir -p "/data/$$dir"
          # Dosya adı her zaman map.osm / map.osm.pbf olur → çıktı her zaman map.osrm
          NAME="map.osm"
          case "$$SRC" in *.pbf) NAME="map.osm.pbf";; esac
          cp "$$SRC" "/data/$$dir/$$NAME"
          osrm-extract -p "/opt/$$profile.lua" "/data/$$dir/$$NAME"
          rm -f "/data/$$dir/$$NAME"
          osrm-partition "/data/$$dir/map.osrm"
          osrm-customize "/data/$$dir/map.osrm"
          echo "$$STAMP" > "/data/$$dir/.source-stamp"
          echo "[osrm-prepare] $$dir ready."
        }
        prepare car car
        prepare bicycle bike
        prepare foot foot
        echo "[osrm-prepare] all profiles ready."

  # 2) Rotalama servisleri — hemen başlar, veri hazır olunca servise girer
  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: dide-osrm-car
    restart: unless-stopped
    volumes:
      - ./osrm-data:/data
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        while [ ! -f /data/car/map.osrm.mldgr ]; do
          echo "[osrm-car] waiting for map data (is osrm-prepare running? check: docker compose logs osrm-prepare)"
          sleep 10
        done
        echo "[osrm-car] data ready, starting router."
        exec osrm-routed --algorithm mld /data/car/map.osrm
    ports:
      - "127.0.0.1:5001:5000"

  osrm-bike:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: dide-osrm-bike
    restart: unless-stopped
    volumes:
      - ./osrm-data:/data
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        while [ ! -f /data/bike/map.osrm.mldgr ]; do
          echo "[osrm-bike] waiting for map data (is osrm-prepare running? check: docker compose logs osrm-prepare)"
          sleep 10
        done
        echo "[osrm-bike] data ready, starting router."
        exec osrm-routed --algorithm mld /data/bike/map.osrm
    ports:
      - "127.0.0.1:5002:5000"

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: dide-osrm-foot
    restart: unless-stopped
    volumes:
      - ./osrm-data:/data
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        while [ ! -f /data/foot/map.osrm.mldgr ]; do
          echo "[osrm-foot] waiting for map data (is osrm-prepare running? check: docker compose logs osrm-prepare)"
          sleep 10
        done
        echo "[osrm-foot] data ready, starting router."
        exec osrm-routed --algorithm mld /data/foot/map.osrm
    ports:
      - "127.0.0.1:5003:5000"
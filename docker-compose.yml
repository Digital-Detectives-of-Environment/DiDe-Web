              echo "[osrm-foot] map data changed → restarting router with the new data."
              kill $$PID 2>/dev/null || true
              wait $$PID 2>/dev/null || true
              break
            fi
          done
          sleep 2
        done
    ports:
      - "127.0.0.1:5003:5000"